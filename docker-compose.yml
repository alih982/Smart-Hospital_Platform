# ============================================
# Docker Compose - Smart Health AI Platform
# معماری میکروسرویس: ۳ سرویس مجزا
# ============================================
version: '3.8'

services:
  # ══════════════════════════════════════════
  # 1. PostgreSQL (مشترک بین backend و ai_service)
  # ══════════════════════════════════════════
  postgres:
    image: postgres:15-alpine
    container_name: smarthealth-postgres
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backup:/backup  # mount volume backup
    environment:
      POSTGRES_DB: smarthealth
      POSTGRES_USER: smarthealth_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-smarthealth_secret_2024}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smarthealth_user -d smarthealth"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ══════════════════════════════════════════
  # 2. Redis (برای Celery + Cache + Channels)
  # ══════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: smarthealth-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ══════════════════════════════════════════
  # 3. Backend (Django + FastAPI + Celery)
  # ══════════════════════════════════════════
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smarthealth-backend
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - backend_static:/app/staticfiles
      - backend_media:/app/media
      - backend_logs:/app/logs
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DOCKER_CONTAINER=true
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"

  # Celery Worker
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smarthealth-celery-worker
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - backend_logs:/app/logs
    env_file:
      - ./backend/.env
    environment:
      - DOCKER_CONTAINER=true
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - backend
      - redis
    command: celery -A config worker -l info --concurrency=2

  # Celery Beat (Cron jobs)
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smarthealth-celery-beat
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - backend_logs:/app/logs
      - ./reports:/reports  # reports output
    env_file:
      - ./backend/.env
    environment:
      - DOCKER_CONTAINER=true
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - backend
      - redis
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler

  # ══════════════════════════════════════════
  # 4. AI Service (FastAPI + llama-cpp-python)
  # ══════════════════════════════════════════
  ai_service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: smarthealth-ai-service
    restart: unless-stopped
    volumes:
      - ./ai_service:/app
      - ./ai_service/app/ai_model:/app/app/ai_model  # مدل GGUF
      - ./ai_service/app/lora_model:/app/app/lora_model  # LoRA adapter
      - ai_service_data:/app/app/data  # MLOps data
      - ./reports:/reports  # reports output
    ports:
      - "5001:5000"
    env_file:
      - ./ai_service/.env
    environment:
      - DB_HOST=postgres
      - DB_URL=postgresql+psycopg2://smarthealth_user:${DB_PASSWORD:-smarthealth_secret_2024}@postgres:5432/ai_service
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          cpus: '2'       # محدودیت CPU برای جلوگیری از داغ شدن
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    # برای CPU-intensive llama-cpp
    cpu_shares: 512
    # استارت با لود مدل
    command: uvicorn app.main:app --host 0.0.0.0 --port 5000 --workers 1 --loop asyncio

  # ══════════════════════════════════════════
  # 5. Frontend (Next.js)
  # ══════════════════════════════════════════
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smarthealth-frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - NEXT_PUBLIC_AI_API_URL=http://ai_service:5000
      - NEXT_PUBLIC_WS_URL=ws://backend:8000/ws
    depends_on:
      - backend
      - ai_service
    command: npm start

  # ══════════════════════════════════════════
  # 6. Nginx (پروکسی معکوس)
  # ══════════════════════════════════════════
  nginx:
    image: nginx:alpine
    container_name: smarthealth-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl  # گواهی SSL (اختیاری)
      - backend_static:/static
      - backend_media:/media
    ports:
      - "80:80"
      - "443:443"  # HTTPS (در صورت وجود SSL)
    depends_on:
      - backend
      - ai_service
      - frontend

volumes:
  postgres_data:
  redis_data:
  backend_static:
  backend_media:
  backend_logs:
  ai_service_data:
