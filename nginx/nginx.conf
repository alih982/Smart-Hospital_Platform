# ============================================
# Nginx Configuration - Smart Health AI Platform
# پروکسی معکوس برای مدیریت ۳ سرویس
# ============================================

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    # ── تنظیمات پایه ──
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    
    keepalive_timeout 65;
    keepalive_requests 100;
    
    client_max_body_size 100M;
    client_body_buffer_size 128k;
    
    # ── فشرده‌سازی ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript text/javascript application/xml+rss image/svg+xml;
    
    # ── Proxy settings ──
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    
    # ── Timeouts ──
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 120s;  # برای AI inference طولانی
    
    # ── SSL (اختیاری - در صورت وجود گواهی) ──
    # ssl_certificate /etc/nginx/ssl/cert.pem;
    # ssl_certificate_key /etc/nginx/ssl/key.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;

    # ── Rate Limiting ──
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=ai_limit:10m rate=5r/s;  # AI (slower)

    # ══════════════════════════════════════════
    # Main Server Block
    # ══════════════════════════════════════════
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        
        # ===========================================
        # STATIC FILES (مستقیم از Django)
        # ===========================================
        location /static/ {
            alias /static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
        
        location /media/ {
            alias /media/;
            expires 7d;
        }
        
        # ===========================================
        # BACKEND (Django API)
        # ===========================================
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            
            proxy_pass http://backend:8000;
            
            # CORS headers
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-CSRFToken";
            
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin *;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-CSRFToken";
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
        }
        
        # WebSocket for Chat
        location /ws/ {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;  # 24 hours for WebSocket
        }
        
        # Django Admin
        location /admin/ {
            proxy_pass http://backend:8000;
        }
        
        # ===========================================
        # AI SERVICE (FastAPI - llama-cpp-python)
        # ===========================================
        location /ai/ {
            limit_req zone=ai_limit burst=3 nodelay;
            
            # بازنویسی مسیر: /ai/chat → /api/v1/chat
            rewrite ^/ai/(.*) /api/v1/$1 break;
            
            proxy_pass http://ai_service:5000;
            proxy_read_timeout 300s;  # 5 دقیقه برای inference
            
            # Streaming support
            proxy_set_header X-Accel-Buffering no;
            proxy_buffering off;
            proxy_cache off;
        }
        
        # AI Service Docs
        location /ai/docs {
            proxy_pass http://ai_service:5000/docs;
        }
        
        # AI Health Check
        location /ai/health {
            proxy_pass http://ai_service:5000/health;
        }
        
        # AI Power BI API
        location /ai/powerbi/ {
            proxy_pass http://ai_service:5000/api/v1/powerbi/;
        }
        
        # ===========================================
        # FRONTEND (Next.js)
        # ===========================================
        location / {
            proxy_pass http://frontend:3000;
            
            # Next.js needs these
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            
            # برای HMR (Hot Module Replacement) در توسعه
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        
        # ===========================================
        # LOGGING
        # ===========================================
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;
        
        # ===========================================
        # SECURITY HEADERS
        # ===========================================
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        
        # ===========================================
        # HEALTH CHECK
        # ===========================================
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
    
    # ===========================================
    # HTTPS Server (در صورت وجود SSL)
    # ===========================================
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    #     
    #     ssl_certificate /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #     
    #     # ... same locations as above ...
    # }
}
